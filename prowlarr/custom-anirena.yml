---
id: aniRena-custom
name: AniRena Custom
description: "AniRena is a Public torrent tracker for the latest anime and Japanese related torrents"
language: en-US
type: public
encoding: UTF-8
links:
  - https://www.anirena.com/

settings:
  - name: info_flaresolverr
    type: info_flaresolverr

caps:
  categorymappings:
    # Anime
    - {id: 1, cat: TV/Anime, desc: "Anime / RAW"}
    - {id: 2, cat: TV/Anime, desc: "Anime / Subtitle(s) and/or Audio(s)"}
    # Software
    - {id: 6, cat: PC, desc: "Software / Application"}
    # Audio
    - {id: 8, cat: Audio, desc: "Audio"}
    - {id: 13, cat: Audio, desc: "Audio / Lossless"}
    # Other
    - {id: 11, cat: Other, desc: "Other"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    music-search: [q]
    book-search: [q]

search:
  headers:
    User-Agent: ["Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0"]
  paths:
    - path: /
  inputs:
    q: "{{ .Keywords }}"

  rows:
    selector: table.tl-table tbody tr[data-torrent-id]

  fields:
    title:
      selector: .col-name .tl-torrent-name
    download:
      selector: .col-actions a[title="Download Torrent"]
      attribute: href
    magnet:
      selector: .col-actions a[title="Magnet Link"]
      attribute: href
    date:
      selector: .col-date
    size:
      selector: .col-size
    seeders:
      selector: .col-se .tl-se
    leechers:
      selector: .col-le .tl-le
    grabs:
      selector: .col-dl
    category:
      selector: .col-cat
      attribute: title
      case:
        "Anime / RAW": 1
        "Anime / Subtitle(s) and/or Audio(s)": 2
        "Software / Application": 6
        "Audio": 8
        "Audio / Lossless": 13
        "Other": 11
        # Fallback: qualquer título não mapeado cai em Other
        "*": 11
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
