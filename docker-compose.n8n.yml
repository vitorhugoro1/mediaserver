services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n-main
    environment:
      - TZ=America/Sao_Paulo
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - CREDENTIALS_OVERWRITE_ENDPOINT=send-credentials
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=true
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_PATH=/
      - N8N_PUBLIC_API_ENDPOINT=api
    ports:
      - 5678:5678
    volumes:
      - ~/data/n8n:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:6-alpine
    restart: always
    volumes:
      - ~/data/n8n/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-task-runners:
    build:
      context: ./
      dockerfile: n8n/Dockerfile.runner
      args:
        - N8N_RUNNERS_VERSION=stable
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_VERSION=stable
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - ./n8n/n8n-task-runners.json:/etc/n8n-task-runners.json
    depends_on:
      - n8n

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n-worker
    command: worker
    environment:
      - TZ=America/Sao_Paulo
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - CREDENTIALS_OVERWRITE_ENDPOINT=send-credentials
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=true
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_PATH=/
      - N8N_PUBLIC_API_ENDPOINT=api
    volumes:
      - ~/data/n8n:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  n8n-worker-runner:
    build:
      context: ./
      dockerfile: n8n/Dockerfile.runner
      args:
        - N8N_RUNNERS_VERSION=stable
    container_name: n8n-worker-runners
    environment:
      - N8N_RUNNERS_VERSION=stable
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - ./n8n/n8n-task-runners.json:/etc/n8n-task-runners.json
    depends_on:
      - n8n-worker
